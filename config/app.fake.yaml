# OFFLINE config: scripted fake LLM + fixture product. Run:
#   synthetic-user run --config config/app.fake.yaml
# Artifacts go to ./artifacts/offline so fake indexes never mix with real ones.
# See config/app.yaml for documentation of every key.

llm:
  provider: fake
  model: fake-scripted
  temperature: null
  timeout_seconds: 60
  max_validation_retries: 2
  max_concurrency: 4
  fake_script_path: ./tests/fixtures/fake_llm_script.json
product:
  timeout_seconds: 30
  max_concurrency: 4
product_adapter:           # or a file: ./config/products/sample_nl2sql.adapter.yaml
  type: fixture             # fixture | http_json | python
  options:
    path: ./data/fixtures/product_responses/sample_responses.json
reference:
  max_chars: 200000          # the whole reference goes into prompts; larger files are refused
generation:
  scenario:
    scenario_count: 3
    include_unsupported_scenarios: true
    diversity_preference: balanced
    max_topup_rounds: 0
  question:
    question_count: 1
    ambiguity_level: low
    language: en
    allow_vague_questions: false
    reject_reference_leaks: true
paths:
  artifacts_dir: ./artifacts/offline
inputs:
  persona_path: ./data/personas/finance_controller.yaml
  product_path: ./data/products/sample_product.yaml
  reference_file: ./data/references/sample_card_spend_catalog.yaml   # data_catalog / document_collection (.yaml/.json); omit -> ungrounded
  reference_guide_file: ./data/references/sample_card_spend_instructions.md   # optional usage instructions (.md / .txt)
  benchmark_cases_path: ./tests/fixtures/benchmark/labeled_cases.jsonl
  benchmark_scenarios_path: ./tests/fixtures/benchmark/scenarios.json
  benchmark_product_paths: [./data/products/sample_product.yaml, ./data/products/sample_chatbot.yaml]
