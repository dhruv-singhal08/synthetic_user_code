# REAL LLM config: Gemini. Needs GOOGLE_API_KEY (or GEMINI_API_KEY) and GEMINI_MODEL in .env
# (GEMINI_MODEL overrides llm.model). Run: synthetic-user serve --config config/app.gemini.yaml
# See config/app.yaml for documentation of every key.

llm:
  provider: gemini
  model: set-GEMINI_MODEL-in-.env
  temperature: null
  timeout_seconds: 120
  max_validation_retries: 2
  max_concurrency: 4
  fake_script_path: null
product:
  timeout_seconds: 300       # per question; the contract `timeout` must not be lower
  max_concurrency: 1         # questions sent to the product at once
product_adapter:           # or a file: ./config/products/sample_nl2sql.adapter.yaml
  type: fixture             # fixture | http_json | python
  options:
    path: ./data/fixtures/product_responses/sample_responses.json
evaluation:
  plugins: [sql]            # artifact plugins for grounded evaluation (sql = SQL plugin)

sql:
  dialect: bigquery
generation:
  scenario:
    scenario_count: 3
    allow_multi_table: true
    include_unsupported_scenarios: true
    diversity_preference: balanced
    max_topup_rounds: 1
  question:
    question_count: 1
    ambiguity_level: low
    language: en
    allow_vague_questions: false
    reject_schema_leaks: true
paths:
  artifacts_dir: ./artifacts
inputs:
  persona_path: ./data/personas/finance_controller.yaml
  product_path: ./data/products/sample_product.yaml
  reference_index_file: ./data/references/sample_card_spend_index.json   # pre-built index; omit -> ungrounded
  benchmark_cases_path: ./tests/fixtures/benchmark/labeled_cases.jsonl
  benchmark_scenarios_path: ./tests/fixtures/benchmark/scenarios.json
  benchmark_product_paths: [./data/products/sample_product.yaml, ./data/products/sample_chatbot.yaml]
