# REAL LLM config: SafeChain (Amex). Copy your SafeChain YAML (idaas + models, e.g. config_e2.yaml)
# to config/safechain.yaml (or set SAFECHAIN_CONFIG_PATH); CIBIS_* credentials go in .env.
# Run: synthetic-user serve --config config/app.safechain.yaml   (see config/app.yaml for every key)

llm:
  provider: safechain
  model: "1"              # SafeChain models key; SAFECHAIN_MODEL_ID overrides
  temperature: null       # ignored: SafeChain YAML model_kwargs set it
  timeout_seconds: 120
  max_validation_retries: 2
  max_concurrency: 4
  fake_script_path: null
  safechain_config_path: ./config/safechain.yaml
product:
  timeout_seconds: 300       # per question; the contract `timeout` must not be lower
  max_concurrency: 1         # questions sent to the product at once
  clarification_policy: ask    # continue clarification turns in the same product session
  ssl_verify: true           # SSL on/off: false = do NOT check the product's TLS certificate
product_adapter:           # or a file: ./config/products/sample_nl2sql.adapter.yaml
  type: fixture             # fixture | http_json | http_sse | python
  options:
    path: ./data/fixtures/product_responses/sample_responses.json
reference:
  max_chars: 200000          # the whole reference goes into prompts; larger files are refused
evaluation:
  default_metrics: [relevance, correctness_completeness]  # CLI default; the UI selects per run
  sql_dialect: null          # explicit sqlglot dialect for the SQL parser; never guessed
  # Temporary product workaround approved by the product team. Remove after their fix ships.
  # Only this exact predicate is removed from the JUDGE's copy of the SQL (AST match).
  ignored_sql_predicates: ["cg_id IN ('DUMMY')"]
generation:
  scenario:
    scenario_count: 3
    include_unsupported_scenarios: true
    diversity_preference: balanced
  question:
    question_count: 1
    max_deliverables: 2                 # hard limit; filters do not count as deliverables
    max_sources: 1                      # one data source per question by default
    max_success_criteria: 2
    max_words: 40
    allowed_complexities: [simple, medium]
    allow_follow_ups: false
    allow_cross_source_comparison: false
    ambiguity_level: low
    language: en
    allow_vague_questions: false
    reject_reference_leaks: true
paths:
  artifacts_dir: ./artifacts
inputs:
  persona_path: ./upload_files/gcs_product_owner_v2.2.yaml
  product_path: ./upload_files/voice_of_customer_agent_v1.1.yaml
  reference_file: ./upload_files/voc_live_tables_reference.yaml   # loaded by default in the UI
  reference_guide_file: null   # optional usage instructions (.md / .txt)
  benchmark_cases_path: ./tests/fixtures/benchmark/labeled_cases.jsonl
  benchmark_scenarios_path: ./tests/fixtures/benchmark/scenarios.json
  benchmark_product_paths: [./data/products/sample_product.yaml, ./data/products/sample_chatbot.yaml]
