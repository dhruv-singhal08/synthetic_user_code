# NL2SQL product API ("nlsql agent") - QA / E2 deployment
#   POST /generate/sql/?timeout=300   body {"input": "<question>", "session_id": "<id>"}
#   Auth: Authorization: Bearer <BLUE_TOKEN>
#   200 -> {"type": "sql", "result": "<SQL>", "widget_title": ..., "column_display_hints": [...],
#           "message": "Here is the SQL query for: ...", "session_id": "<id>"}
#   200 -> {"type": "clarification", "result": null, "message": "How many airline routes ...?",
#           "options": ["Top 10 routes", "Top 25 routes", ...], "session_id": "<id>"}
#   A clarification is answered (one of the options, as the persona) on the SAME session_id
#   until the product returns SQL; needs product.clarification_policy: ask in the app config
#   (product.max_clarification_turns caps the answers; still asking after that = recorded only).
#
# Web UI: upload this file as the contract in "Product connection" (the URL field wins over
#   options.url below).
# CLI:    product_adapter: ./config/products/generate_sql.adapter.yaml
#
# Token (valid ~1 hour): paste it into the Authorization header below, replacing
#   PASTE_YOUR_BLUE_TOKEN_HERE. It is masked in logs, traces and stored results, but this file
#   is tracked by git: do not commit it with the token in it. To keep the token out of the
#   file instead, use  Authorization: "Bearer ${BLUE_TOKEN}"  and  export BLUE_TOKEN='...'.
# SSL: certificate checking is OFF for this QA endpoint (ssl_verify: false below).
type: http_json
options:
  url: https://gcsgenaiconvbi-qa.aexp.com/generate/sql/?timeout=300   # ?timeout = the product's own limit
  method: POST
  ssl_verify: false                   # SSL off: the endpoint's certificate is NOT checked
  timeout: 320                        # HTTP wait per question; a bit above the product's 300s
                                      # (the app config's product.timeout_seconds is also a limit; lower wins)
  headers:
    Authorization: "Bearer PASTE_YOUR_BLUE_TOKEN_HERE"   # or "Bearer ${BLUE_TOKEN}" (from env)
    accept: "*/*"
    Content-Type: application/json
  request_template:
    input: "{utterance}"
    session_id: "{session_id}"        # one session per question, reused for its clarification
                                      # answers (a fresh one for the next question)
  response_mapping:
    text: message                     # the product's explanation, judged by the generic checks
    artifacts:
      - kind: sql                     # judged against the reference pack (grounded runs)
        path: result
      - kind: widget_title            # kept for the record / evidence
        path: widget_title
      - kind: column_display_hints
        path: column_display_hints
    # The product's own `type` decides the outcome and is kept on every response (D242), so an
    # HTTP 200 that did not complete the task is never recorded as answered. A value not listed
    # here is kept and judged as an answer of unknown kind (add it when it is known).
    response_type:
      path: type
      outcomes:
        sql: answered                 # an SQL answer
        clarification: clarification  # the product asks a question back
        unsupported: denied           # the product says it cannot do this request
        blocked: denied               # the product blocked the request
    clarification_message: message
    clarification_options: options    # the choices offered; the synthetic user picks one
    denied_message: message
