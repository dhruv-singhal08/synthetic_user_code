# Sample document collection (format: document_collection, D203). Illustrative; not a real policy.
kind: document_collection
name: Corporate Travel & Expense Policy
description: Policy documents the travel policy assistant answers from.

documents:
  - name: Hotel policy
    summary: >
      Employees may book standard rooms only. The nightly hotel limit is USD 250 in Tier 1
      cities (New York, London, Paris, Tokyo) and USD 180 everywhere else, taxes included.
      Stays above the limit need written approval from the employee's director before booking.
  - name: Meals and per diem
    summary: >
      The daily meal per diem is USD 75 in Tier 1 cities and USD 55 everywhere else.
      Alcohol is never reimbursable.
  - name: Receipts
    summary: >
      An itemised receipt is required for every expense of USD 25 or more. Lost receipts must
      be reported with the missing receipt form within 30 days.
  - name: Approvals
    summary: >
      Expense reports are approved by the employee's direct manager in the expense tool. The
      policy assistant cannot submit, approve or check the status of an expense report.
