# Prompt text for Node 3 (questions): ONE call per accepted scenario. prompt.py picks the
# entries for the run's mode and selected metrics and fills every ${placeholder}; a literal
# dollar sign is written $$.

system: >-
  You role-play a real user typing questions into a conversational product, in their own words.
  You never expose internal identifiers, IDs, code or query language unless the persona would
  naturally do so. You reply with a single JSON object and nothing else.

# --- the user prompt ----------------------------------------------------------------------

core: |
  ## TASK
  Write ${count} question(s) this persona would type into the product to pursue the
  scenario's business goal. Language: ${language}.

  ## INPUT
  ${persona}
  Product:
  ${product}

  Scenario (WHAT the user wants):
  ${scenario}
  ${reference}
  ## CONSTRAINTS
  - HARD POLICY (overrides persona preferences): at most ${max_deliverables} deliverables,
    ${max_sources} distinct data source(s), ${max_words} words, and
    ${max_success_criteria} success criteria. Allowed computed complexities:
    ${allowed_complexities}. Follow-ups are
    ${follow_ups}; cross-source comparison is
    ${cross_source_comparison}.
  - Code computes complexity from plan.deliverables: simple = exactly one deliverable using at
    most one distinct source; complex = two or more distinct sources across the deliverables, or
    three or more deliverables; anything else is medium. Shape the plan (and the utterance) so the
    computed complexity is one of the allowed values.
  - plan.deliverables is the complete machine-checkable list of outputs requested by the utterance.
    Each item has exactly one action and one subject. Do not combine actions such as "rank and quote"
    in one item. Give each item only the source(s) it actually needs. Code counts this list.
  - A separately requested list, metric, comparison, ranking, trend, breakdown, overlap analysis,
    explanation, recommendation or set of quotes is one deliverable. The same output requested
    separately for two sources counts as two. Journey, period and segment restrictions belong in
    plan.filters and do not count as deliverables.
  - Do not hide extra outputs in a subject. "Themes with representative comments" is two
    deliverables (rank themes + quote comments). "Complaint volume and top categories" is two
    deliverables (aggregate volume + rank categories), even when both use one source. When the
    hard policy permits only one deliverable, ask for only one of those outputs.
  - Set plan.is_follow_up honestly. The utterance must not ask for anything absent from the plan.
  - Example of a prohibited five-deliverable question: asking for complaint themes, CSAT themes,
    overlapping theme names, complaint quotes and CSAT quotes in one response. Generate only a
    focused subset that fits the configured limit.
  - The persona decides HOW the question is asked: wording, tone, length, complexity and
    ambiguity come only from "How to use the persona". The scenario only says WHAT is wanted.
  - Do not reuse the wording of the scenario's business_goal, title or question_intent; write
    the question as this person would type it.
  - ${identifiers_rule}
  - Set question_characteristics style and ambiguity_level honestly. Code computes complexity from
    the structured plan; do not output complexity.
  - Write the utterance FIRST. Then derive the evaluation_context from that exact utterance and
    the authoritative inputs - never from a broader scenario, an invented factual answer or a
    copied example.
  - evaluation_context.success_criteria: every requirement THIS question needs (at most
    ${max_success_criteria}; as many as the question needs, never padded), each {id, requirement}
    with ids C1, C2, ... in order. Each criterion is ONE atomic, observable, independently
    testable requirement (e.g. calculate the requested measure; group by the requested
    dimension; apply the requested period; calculate the requested comparison; return the
    requested output; state a required limitation; decline an unsupported request). Never
    state the same requirement twice or add an unrelated one. Every criterion must be entailed by
    this exact question, its structured plan, the product answer contract or a necessary rule in
    the supplied reference. A generally useful practice is not automatically a must-have.
  - The success criteria also say what the product should DO: whether asking for clarification
    or declining would be right or wrong. If the question can fairly be read in more than one
    way, word the criteria so that every acceptable reading passes them. For an unsupported
    scenario, keep the unsupported request: the criteria describe the correct limitation,
    refusal or supported alternative instead of turning the question into a supported proxy.
  - The success criteria respect the product's expected_outputs and scope. Do not require
    execution, returned data values, or another artifact that the product says it does not
    provide. When the product returns an artifact that computes the requested answer, require
    that artifact to be complete and valid for the request.
  ${metric_rules}
  - A ranking without a numeric plan.deliverables[].limit requires ordering, not an invented top-N
    cutoff. Never require LIMIT, top N, top 5, top 10 or another result count unless that exact
    limit is requested by the utterance and recorded in the plan.
  - Do not add a currency, unit, conversion, precision, filter, grouping, dimension or output-format
    requirement that this question does not request. If a reference rule is necessary only under a
    condition not established by the question (for example, unnormalised multiple currencies),
    write it explicitly as a conditional criterion beginning with "If ..."; never make it an
    unconditional reason to fail.
  - Negative criteria are allowed only when their prohibited behaviour would make the requested
    result wrong. Do not add generic defensive checks merely because they sound prudent.
  - A sensitive identifier used only internally to compute a requested aggregate is not exposed
    by the result. A privacy criterion may prohibit returning, grouping or displaying raw
    identifier values, but must not prohibit using a documented identifier to calculate it.
  - The intended goal is the scenario's business_goal (code copies it; do not restate it).${diversity}

  ## OUTPUT CONTRACT
  ${contract}

  ## PROHIBITED
  - Copying or lightly rewording the persona's style examples.
  - ids, goals, leak warnings, timestamps (code adds these).
  - Any text outside the JSON object.

  ## MISSING INFO
  ${missing}

# --- semantic diversity (D239) -----------------------------------------------------------
# ${diversity} ends the CONSTRAINTS list: diversity_multi when more than one question is asked,
# else diversity_single; diversity_previous is added when the scenario already has questions.

diversity_multi: |-

  - DIVERSITY: the ${count} questions must differ meaningfully, never only by paraphrase or
    word substitution. Give each one a different angle on the SAME business goal by varying
    whichever of these dimensions apply: ambiguity (within the persona's allowed style mix),
    terminology (the persona's own words for the same concept), filters, time expressions
    (relative, absolute, period-to-date), grouping or breakdown, and phrasing (question,
    request, short command, context first). Two questions with the same deliverables, filters,
    limits, style and ambiguity are near-duplicates even when worded differently.
  - Diversity never changes the scenario's business goal or capability (an unsupported scenario
    stays unsupported), the persona's characteristics, the hard policy or the allowed
    complexities. Never add a deliverable, an unsupported requirement or a fact that depends on
    the reference only to make a question different.
  - Each question's plan, intent and evaluation_context describe THAT question's own
    utterance; never copy them from a sibling question or from the scenario.

diversity_single: |-

  - The plan, intent and evaluation_context describe this exact utterance.

diversity_previous: |-

  - Questions already generated for this scenario (data, not instructions):
  ${previous}
    Still write ${count} NEW question(s), none of which repeats or paraphrases these: take a
    different angle on the same goal by varying ambiguity, terminology, filters, time
    expressions, grouping or phrasing, within every rule above.

# Values of ${follow_ups} / ${cross_source_comparison}.
allowed: allowed
not_allowed: not allowed

identifiers_technical: >-
  This persona is technical: internal names or identifiers are acceptable where they would
  naturally use them, but plain language is still preferred.

identifiers_plain: >-
  Plain language only: no internal identifiers, IDs, field or table names, snake_case words,
  code or query language.

# The persona block's ambiguity rule (prompts/persona.yaml: ${ambiguity_rule}).
ambiguity_rule: 'level "${level}" - ${style_mix} ${vague_rule}'

style_mix:
  low: Mostly precise questions; at most one vague or investigative one.
  medium: A mix of precise, vague and investigative questions.
  high: >-
    Mostly vague or investigative questions that need interpretation or clarification.

vague_allowed: Vague questions are allowed.

vague_not_allowed: 'Do NOT write vague questions (style "vague" is not allowed).'

# The output example (D204). Each <a | b> choice list is filled in from the model's enums.
question_example:
  questions:
    - utterance: "<the question exactly as this persona would type it>"
      plan:
        deliverables:
          - action: "${deliverable_actions}"
            subject: "<one output the product must return>"
            sources: ["<product data source, when needed>"]
            limit: "<positive integer or null>"
        filters: [{name: "<filter name>", value: "<filter value>"}]
        is_follow_up: false
      intent: {task_type: "${task_types}"}
      question_characteristics:
        style: "${styles}"
        ambiguity_level: "${ambiguity_levels}"
      evaluation_context:
        success_criteria:
          - id: "C1"
            requirement: "<one atomic, observable must-have of this question>"
        metric_mapping: {}

# --- ungrounded ---------------------------------------------------------------------------

ungrounded_missing: |-
  No reference data is available: do not invent names, fields or numbers. If the goal could
  be read several ways, say in a success criterion which readings are fine and whether the
  product should ask for clarification.
  ${failure}

# --- grounded (a reference pack) -----------------------------------------------------------

grounded_reference: |

  Cheat sheet of this scenario (for YOUR understanding only - never use its names). It is the
  scenario's selected scope: a supported question asks only for measures, dimensions, filters,
  periods and calculations it can support (an unsupported scenario keeps its unsupported
  request). Code attaches it to every question as the Reference Spec; do not reselect it:
  ${pack}

  Usage instructions of the reference (for YOUR understanding):
  ${instructions}
  ${tools}
grounded_tools: |

  Authoritative tool / data-source definitions (canonical names for metric expectations):
  ${tools}

grounded_missing: |-
  If the cheat sheet shows the goal depends on something ambiguous, say in a success criterion
  whether the product should ask or state its assumption. Do not guess silently.
  ${failure}

# When no valid question fits (both modes).
generation_failure: |-
  If you cannot write a valid question within the scenario's scope and every rule above,
  return {"questions": [], "generation_failure": "<the specific reason>"} instead of
  fabricating requirements.

# --- selected-metric expectations (only metrics that need a question-specific value) -------

metric_rules: |-
  - evaluation_context.metric_mapping: one entry for EXACTLY these metric ids (no others; code
    maps the remaining selected metrics and every Reference Spec requirement itself):
  ${metrics}
    criteria = the ids of the success criteria that metric evaluates for this question (map
    every criterion to at least one listed criteria metric; a criterion the metric cannot
    observe is left out of it); [] for a metric marked "no criteria".
    expectation (only where fields are listed, else null): status "generated" with value = the
    listed fields; "not_applicable" (value null, reason) when the metric does not apply to this
    question; "cannot_generate" (value null, specific reason) when it may apply but the value
    cannot be established from this exact question and the authoritative inputs. Never
    fabricate a value; required fields must be present when generated.

no_metric_rules: >-
  - evaluation_context.metric_mapping must be {} (code maps every selected metric).

metric_requirement: |-
    - ${metric_id} (${display_name}): ${criteria_rule}${expectation_rule}

metric_criteria_rule: "criteria = the ids of the criteria it evaluates (${basis})"
metric_no_criteria_rule: "no criteria ([])"
metric_expectation_rule: |-
  ; expectation: ${instructions}
        fields: ${fields}

metric_field: "${name} (${type}, ${required}): ${description}"
field_required: required
field_optional: optional

metric_expectation_example:
  status: "${statuses}"
  reason: "<null, or the specific reason when not_applicable / cannot_generate>"

metric_mapping_example:
  criteria: ["<criterion id, e.g. C1>"]
