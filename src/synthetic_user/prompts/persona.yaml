# How the scenario and question prompts present the persona (persona schema v2, D200).
# persona.py fills every ${placeholder}; a literal dollar sign is written $$.

# What each question_preferences.complexity value means.
complexity_meaning:
  simple: one fact, metric or item, with at most one filter or period
  medium: a breakdown, ranking or comparison with two or three conditions
  complex: >-
    several parts or dimensions at once: comparisons across segments or periods, root
    causes, trade-offs or impact

complexity_meaning_item: "${complexity} = ${meaning}"

# A fixed complexity preference (not "mixed").
complexity_fixed_questions: >-
  complexity preference is ${complexity}: prefer ${complexity} - ${meaning}. The application's
  hard question policy wins if it requires a simpler question.
complexity_fixed_scenarios: "complexity is ${complexity}: every ${unit} is ${complexity} - ${meaning}."

# complexity "mixed".
complexity_mixed_scenarios: "complexity is mixed: spread the scenarios across all three (${meanings})."
complexity_mixed_questions: >-
  complexity is mixed: use the one that fits the scenario's goal (${meanings}), within the
  application's hard question policy.

expertise_rule: >-
  expertise.levels: per area, low | medium | high. In a high area use its specialist
  vocabulary and go deep; in a low area stay basic and in plain words. expertise.notes say
  what this person knows and does not know - respect them.

scenario_block: |
  Persona (who pursues these goals):
  ${persona}

  How to use the persona:
  - typical_tasks: base each scenario on one of them and copy its exact text into
    typical_task. Spread the scenarios over different typical tasks (use as many different
    ones as the count allows before repeating one). typical_task is null only for another task
    this persona would clearly do.
  - primary_motivation: frame each business_goal as a step towards it.
  - decision_inputs: the evidence this persona relies on. Prefer goals whose answer draws on
    one of these AND that the product can provide (a goal needing evidence the product does
    not have is an unsupported scenario).
  - traits: let them shape what each goal looks for and its success_criteria (e.g. "explores
    root causes" -> a criterion about the cause, not only the number).
  - ${expertise_rule}
  - question_complexity: ${complexity_rule}

question_block: |
  Persona (sound like this person):
  ${persona}

  Style examples - how this person writes (match their length, tone and vocabulary; NEVER copy
  or lightly reword them, copies are rejected):
  ${examples}

  How to use the persona:
  - style: the tone and length of every question.
  - traits: every question must reflect at least one trait (what they ask about and how).
  - ${expertise_rule}
  - primary_motivation: the reason behind the question; it shapes what they ask for.
  - decision_inputs: the kinds of evidence they ask for or refer to (only those that fit the
    scenario and the product).
  - ${complexity_rule} Code computes the final complexity from the
    structured question plan.
  - ${follow_ups}
  - ambiguity: ${ambiguity_rule}

follow_ups_on: >-
  follow_up_questions is true: this person digs deeper (why, impact, risk, what next). Each
  question is sent on its own with no conversation history, so write such a question
  self-contained: restate the context, then ask the deeper question.
follow_ups_off: >-
  follow_up_questions is false: write first questions only - no 'why did that happen' or
  'what about...' style follow-ups.

style_example: "  - ${utterance}"
no_style_examples: "  - (none given)"
