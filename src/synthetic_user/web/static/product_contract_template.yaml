# Product contract: how Synthetic User calls your product and reads its reply.
# Upload it in "Product connection" together with the product URL (the URL field wins over
# `url` below). Any JSON-over-HTTP conversational product works - no code needed.
#
# Secrets: never paste a token here. Use ${ENV_VAR} and set the variable before
# `synthetic-user serve`; header values are never shown in the UI, logs or results.

method: POST                          # GET sends no body
headers:
  Authorization: "Bearer ${PRODUCT_API_TOKEN}"
timeout: 300                          # HTTP seconds per question (product.timeout_seconds in
                                      # the app config also applies; the lower one wins)

# Request body. {utterance} = the generated question; {uuid} = a fresh UUID per question
# (use it for a session / request id); {session_id} = the tool's session (null in single-turn).
request_template:
  question: "{utterance}"
  session_id: "{uuid}"

# Where the reply lives: dotted paths into the JSON body (list items by index, e.g. data.items.0).
response_mapping:
  text: data.answer                   # answer text (text and/or an artifact is required)
  artifacts:                          # optional, e.g. SQL / chart spec / citations
    - kind: sql
      path: data.sql
  clarification_when: "data.type == clarification"   # optional, conditions are `path == value`
  clarification_message: data.answer
  denied_when: "data.status == unsupported"          # optional
  denied_message: data.answer
  product_version: meta.version                      # optional
