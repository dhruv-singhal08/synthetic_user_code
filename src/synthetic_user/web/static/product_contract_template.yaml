# Product contract: how Synthetic User calls your product and reads its reply.
# Upload it in "Product connection" together with the product URL (the URL field wins over
# `url` below). Any JSON-over-HTTP conversational product works - no code needed.
#
# Secrets: never paste a token here. Use ${ENV_VAR} and set the variable before
# `synthetic-user serve`; header values are never shown in the UI, logs or results.

method: POST                          # GET sends no body
headers:
  Authorization: "Bearer ${PRODUCT_API_TOKEN}"
timeout: 300                          # HTTP seconds per question (product.timeout_seconds in
                                      # the app config also applies; the lower one wins)
# Optional TLS trust bundle: `amexcerts`, a PEM file path, or `${PRODUCT_CA_BUNDLE}`.
# Certificate and hostname verification remain enabled.
# tls_ca_bundle: "${PRODUCT_CA_BUNDLE}"
# SSL on/off. false = the certificate and host name are NOT checked: only for a test server
# with a self-signed certificate. product.ssl_verify in the app config can also turn it off.
# ssl_verify: true

# Request body. {utterance} = the generated question; {uuid} = a fresh UUID per question
# (use it for a request id); {session_id} = one stable id reused across clarification turns.
request_template:
  question: "{utterance}"
  session_id: "{session_id}"

# Where the reply lives: dotted paths into the JSON body (list items by index, e.g. data.items.0).
response_mapping:
  text: data.answer                   # answer text (text and/or an artifact is required)
  artifacts:                          # optional, e.g. SQL / chart spec / citations
    - kind: sql
      path: data.sql
  clarification_when: "data.type == clarification"   # optional, conditions are `path == value`
  clarification_message: data.answer
  denied_when: "data.status == unsupported"          # optional
  denied_message: data.answer
  product_version: meta.version                      # optional
  # Optional: a typed "cannot answer" inside an answered payload (product_outcome stays
  # answered; response_classification becomes unable_to_answer without an extra LLM call).
  # unable_to_answer_when: "data.kind == cannot_answer"
  # correlation_id: meta.request_id                  # the product's request / trace id

  # --- metric telemetry (only needed for the metrics that use it) ---------------------------
  # Tool Correctness: the ordered tool calls the product made (paths inside each item).
  # tool_trace: {path: data.tool_calls, name: name, operation: op, arguments: input, result: output, error: error}
  #
  # Retrieval / grounding metrics: choose ONE context source.
  # (a) Context IN the product response:
  # context:
  #   path: data.chunks                 # list of retrieved chunks
  #   chunk_id: id                      # paths inside each chunk
  #   text: text
  #   source_id: document
  #   rank: rank                        # explicit rank (MRR); or `order_is_rank: true` when
  #                                     # the product documents that list order IS the rank
  # citations: {path: data.citations, chunk_id: chunk, claim: text}   # Citation Correctness

# (b) A SEPARATE context API, called for the SAME execution after the answer. {correlation_id}
# is the product's request / trace id (correlation_id above), else this request's {uuid},
# else the session id. Never configure both (a) and (b).
# context_api:
#   url: https://product.example.com/v1/context/{correlation_id}
#   method: GET
#   headers: {Authorization: "Bearer ${PRODUCT_API_TOKEN}"}
#   timeout: 30
#   context: {path: chunks, chunk_id: id, text: text, source_id: document, rank: rank}
#   citations: {path: citations, chunk_id: chunk, claim: text}
